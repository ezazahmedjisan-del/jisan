<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার AI চ্যাটবট</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 90vh;
    background: #16213e;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .chat-header {
    background: #0f3460;
    padding: 18px;
    color: white;
    font-size: 18px;
    font-weight: bold;
  }
  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .bot {
    background: #0f3460;
    color: #eee;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .user {
    background: #e94560;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .typing { font-style: italic; opacity: 0.7; }
  .chat-input {
    display: flex;
    padding: 12px;
    background: #0f3460;
    gap: 8px;
  }
  .chat-input input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  .chat-input button {
    background: #e94560;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
  }
  .chat-input button:hover { background: #c9314a; }
  .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">🤖 আমার AI চ্যাটবট</div>
  <div class="chat-messages" id="messages">
    <div class="message bot">আসসালামু আলাইকুম! আমি তোমার AI চ্যাটবট (Gemini দিয়ে চলছি)। কিছু জিজ্ঞেস করো।</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="এখানে লিখো..." />
    <button id="sendBtn" onclick="sendMessage()">পাঠাও</button>
  </div>
</div>

<script>
  const API_KEY = "AQ.Ab8RN6JLqxuFbgnMVnbVwJfisUycdRXkBQg8ZQqLCtcK0EhuwA";
  const MODEL = "gemini-2.5-flash";

  let conversationHistory = [];

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    conversationHistory.push({ role: "user", parts: [{ text }] });
    input.value = '';
    sendBtn.disabled = true;

    const typingDiv = addMessage("লিখছে...", 'bot typing');

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: conversationHistory,
          systemInstruction: {
            parts: [{ text: "তুমি একজন সহায়ক বাংলা AI সহকারী। বাংলা বা বাংলিশে সহজভাবে উত্তর দাও।" }]
          }
        })
      });

      const data = await response.json();

      if (data.error) {
        typingDiv.textContent = "এরর: " + data.error.message;
      } else {
        const reply = data.candidates[0].content.parts[0].text;
        typingDiv.textContent = reply;
        typingDiv.classList.remove('typing');
        conversationHistory.push({ role: "model", parts: [{ text: reply }] });
      }
    } catch (err) {
      typingDiv.textContent = "সমস্যা হয়েছে, ইন্টারনেট চেক করো। (" + err.message + ")";
    }

    sendBtn.disabled = false;
  }

  function addMessage(text, sender) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ' + sender;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  document.getElementById('userInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
