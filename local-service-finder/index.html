<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8f5">
<title>সেবা খুঁজুন — Local Service Finder BD</title>
<style>
:root{--ink:#25342d;--muted:#68766e;--green:#176b4b;--green2:#e9f2ec;--line:#dfe6df;--paper:#fff;--bg:#f7f8f5;--gold:#d6a84d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nirmala UI","SolaimanLipi",Arial,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,a.btn{cursor:pointer}.wrap{width:min(1120px,92%);margin:auto}.top{height:76px;border-bottom:1px solid var(--line);background:#fff}.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px}.mark{height:38px;width:38px;border-radius:10px;background:var(--green);color:white;display:grid;place-items:center;font-size:23px}.brand small{display:block;font-size:9px;letter-spacing:1.1px;color:var(--muted);font-weight:600;margin-top:-4px}.navright{display:flex;gap:12px;align-items:center}.navright a{font-size:14px;color:#526158}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--green);border-radius:7px;padding:11px 18px;background:var(--green);color:#fff;font-weight:700;font-size:14px}.btn.light{background:white;color:var(--green)}.btn.plain{border-color:var(--line);background:#fff;color:var(--ink)}.hero{padding:66px 0 52px;background:linear-gradient(110deg,#f4f7f1,#edf4ed)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:44px}.eyebrow{font-size:12px;letter-spacing:1.6px;font-weight:800;color:var(--green);text-transform:uppercase}.hero h1{font-size:clamp(32px,5vw,51px);line-height:1.18;margin:13px 0 18px;letter-spacing:-1px}.hero p{max-width:580px;color:#5c6b62;font-size:17px;margin:0}.illustration{min-height:250px;border:1px solid #d8e3d7;background:#fff;border-radius:14px;padding:25px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center;box-shadow:0 12px 34px #254a3210}.illus-card{padding:19px 14px;border:1px solid var(--line);border-radius:9px;background:#fbfcfa;text-align:center}.illus-icon{font-size:31px}.illus-card b{display:block;margin-top:8px}.illus-card span{font-size:12px;color:var(--muted)}.choose{padding:48px 0 62px}.section-head{text-align:center;margin-bottom:27px}.section-head h2{font-size:27px;margin:0 0 8px}.section-head p{margin:0;color:var(--muted)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:850px;margin:auto}.choice{display:block;text-align:left;background:white;border:1px solid var(--line);border-radius:11px;padding:24px 25px;transition:.16s}.choice:hover{border-color:#83a994;box-shadow:0 8px 24px #173e2810;transform:translateY(-2px)}.choice .icon{font-size:30px}.choice h3{margin:8px 0 5px;font-size:22px}.choice p{margin:0;color:var(--muted);font-size:14px}.choice strong{display:inline-block;color:var(--green);margin-top:17px;font-size:14px}.login-note{text-align:center;color:var(--muted);margin-top:22px;font-size:14px}.login-note a{font-weight:800;color:var(--green);text-decoration:underline}.foot{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}.footin{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.page{padding:42px 0 65px;min-height:70vh}.crumb{color:var(--muted);font-size:13px;margin-bottom:18px}.crumb a{color:var(--green)}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:26px;max-width:820px}.panel h1{font-size:29px;line-height:1.3;margin:0 0 9px}.panel>p{color:var(--muted);margin:0 0 22px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.step{background:#f7faf7;border:1px solid var(--line);padding:16px;border-radius:8px}.step b{display:block;margin-bottom:4px}.step span{font-size:13px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.form{display:grid;gap:14px;margin-top:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd9d0;border-radius:6px;background:#fff;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b4b15}.note{border-left:3px solid var(--gold);background:#fff9eb;padding:12px 14px;font-size:13px;color:#665736;margin-top:17px}.muted{color:var(--muted)}.hidden{display:none!important}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:20px 0}.mini{background:white;border:1px solid var(--line);border-radius:8px;padding:17px}.mini b{display:block}.mini span{font-size:13px;color:var(--muted)}.status{background:#f2f5f2;border:1px solid var(--line);padding:16px;border-radius:8px}.alert{margin-top:15px;padding:12px 14px;border-radius:7px;background:#fff5e9;border:1px solid #ead9b6;color:#725324;font-size:13px}.back{display:inline-block;margin-top:18px;color:var(--green);font-weight:700;font-size:14px}
@media(max-width:760px){.hero-grid{grid-template-columns:1fr}.illustration{min-height:190px}.choices{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.steps,.cards{grid-template-columns:1fr}.navright a:not(.btn){display:none}.hero{padding:42px 0 34px}.hero p{font-size:15px}.panel{padding:19px}}

/* Customer service finder page */
.account-bar{display:flex;align-items:center;gap:10px;background:#f3f7f3;border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin:0 0 20px}
.avatar{height:36px;width:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
.account-meta b{display:block;font-size:13px;line-height:1.25}.account-meta span{font-size:11px;color:var(--muted)}
.find-hero{background:linear-gradient(120deg,#eff6ef,#f9fbf7);padding:34px 0 28px;border-bottom:1px solid var(--line)}
.find-hero h1{font-size:clamp(26px,4vw,38px);line-height:1.25;margin:7px 0}
.find-hero p{color:var(--muted);margin:0}
.search-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:22px;box-shadow:0 8px 24px #254a320c}
.search-grid{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:10px;align-items:end}
.search-field label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}
.search-field select,.search-field input{width:100%;border:1px solid #cfd9d0;border-radius:7px;padding:11px;background:#fff;min-width:0}
.find-content{padding:32px 0 56px}
.service-categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0 30px}
.service-category{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px 12px;text-align:center;cursor:pointer;color:var(--ink);transition:.15s}
.service-category:hover,.service-category.active{border-color:var(--green);background:#f1f7f2}
.service-category .big{font-size:26px;display:block}.service-category b{font-size:14px;display:block;margin-top:5px}
.result-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 14px}
.result-head h2{margin:0;font-size:22px}.result-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.sample-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.sample-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px}
.sample-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.sample-icon{height:44px;width:44px;border-radius:10px;background:#edf4ed;display:grid;place-items:center;font-size:23px}
.sample-card h3{font-size:16px;margin:0}.sample-card p{font-size:13px;color:var(--muted);margin:3px 0 0}
.sample-label{display:inline-block;font-size:10px;font-weight:800;color:#765b22;background:#fff5dd;border:1px solid #f0dfb5;padding:3px 7px;border-radius:20px;margin-bottom:10px}
.sample-card .btn{margin-top:13px;width:100%}
.demo-message{display:none;border:1px solid #ead9b6;background:#fff9eb;color:#725324;padding:12px 14px;border-radius:8px;font-size:13px;margin-top:14px}
.demo-message.show{display:block}
@media(max-width:850px){.search-grid{grid-template-columns:1fr 1fr}.sample-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.search-grid{grid-template-columns:1fr}.service-categories{grid-template-columns:1fr 1fr}.sample-grid{grid-template-columns:1fr}.result-head{align-items:start;flex-direction:column}}

</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="#home"><span class="mark">⌂</span><span>সেবা খুঁজুন<small>LOCAL SERVICE FINDER BD</small></span></a><div class="navright"><a href="#about">কীভাবে কাজ করে</a><a class="btn light" href="#login">লগইন করুন</a></div></div></header>
<main id="app"></main>
<footer class="foot"><div class="wrap footin"><span>© ২০২৬ সেবা খুঁজুন · Local Service Finder BD</span><span><a href="#about">ব্যবহারের নিয়ম</a>　·　<a href="#home">হোম</a></span></div></footer>
<script>
const app=document.getElementById('app');
const renderers={
home:()=>`
<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">আপনার এলাকার সেবা, এক জায়গায়</div><h1>প্রয়োজনের সময়<br>পাশে থাকুক প্রয়োজনীয় মানুষ</h1><p>ইলেকট্রিশিয়ান, প্লাম্বার, টিউটরসহ স্থানীয় সেবাদাতাদের সঙ্গে সহজে যোগাযোগের একটি প্ল্যাটফর্ম। আপনি কাজ খুঁজছেন, নাকি নিজের সেবা দিতে চান—শুরু করুন এখান থেকে।</p></div><div class="illustration"><div class="illus-card"><div class="illus-icon">🔧</div><b>দক্ষ কারিগর</b><span>নিজের এলাকায় খুঁজুন</span></div><div class="illus-card"><div class="illus-icon">📍</div><b>এলাকাভিত্তিক</b><span>জেলা ও উপজেলা বেছে নিন</span></div><div class="illus-card"><div class="illus-icon">🤝</div><b>সহজ যোগাযোগ</b><span>সেবাদাতার সঙ্গে যুক্ত হোন</span></div><div class="illus-card"><div class="illus-icon">✓</div><b>যাচাইয়ের ব্যবস্থা</b><span>প্রোফাইল অনুমোদনের পরিকল্পনা</span></div></div></div></section>
<section class="choose"><div class="wrap"><div class="section-head"><h2>আপনি কী করতে চান?</h2><p>নিচের একটি অপশন বেছে নিয়ে পরের ধাপে যান।</p></div><div class="choices"><a class="choice" href="#customer"><div class="icon">🔎</div><h3>মানুষ খুঁজুন</h3><p>আপনার এলাকার ইলেকট্রিশিয়ান, প্লাম্বার, টিউটর বা প্রয়োজনীয় সেবাদাতা খুঁজুন।</p><strong>সেবাগ্রহীতা হিসেবে এগিয়ে যান　→</strong></a><a class="choice" href="#provider"><div class="icon">🧰</div><h3>আমি নিজে কর্মী</h3><p>আপনার কাজ ও দক্ষতার তথ্য দিয়ে সেবাদাতা হিসেবে যুক্ত হোন।</p><strong>সেবাদাতা হিসেবে এগিয়ে যান　→</strong></a></div><div class="login-note">আগে থেকেই অ্যাকাউন্ট আছে? <a href="#login">লগইন করুন</a></div></div></section>`,
customer:()=>`
<section class="page"><div class="wrap"><div class="crumb"><a href="#home">হোম</a>　/　মানুষ খুঁজুন</div><div class="panel"><div class="eyebrow">সেবাগ্রহীতা</div><h1>আপনার প্রয়োজনীয় সেবাদাতা খুঁজে নিন</h1><p>প্রথমে একটি অ্যাকাউন্ট খুলুন। এরপর নিজের এলাকা নির্বাচন করে সেবাদাতা খুঁজতে পারবেন।</p><div class="steps"><div class="step"><b>১. অ্যাকাউন্ট খুলুন</b><span>নাম ও ইমেইল দিয়ে নিবন্ধন</span></div><div class="step"><b>২. এলাকা বাছুন</b><span>বিভাগ, জেলা ও উপজেলা দিন</span></div><div class="step"><b>৩. সেবা খুঁজুন</b><span>কাজের অনুরোধ পাঠান</span></div></div><div class="actions"><a class="btn" href="#signup-customer">সেবাগ্রহীতা অ্যাকাউন্ট খুলুন →</a><a class="btn light" href="#login">আগে থেকেই অ্যাকাউন্ট আছে</a></div></div></div></section>`,
provider:()=>`
<section class="page"><div class="wrap"><div class="crumb"><a href="#home">হোম</a>　/　আমি নিজে কর্মী</div><div class="panel"><div class="eyebrow">সেবাদাতা</div><h1>নিজের কাজের পরিচিতি তৈরি করুন</h1><p>আপনি কী কাজ করেন, কোথায় সেবা দেন এবং কীভাবে আপনার সঙ্গে যোগাযোগ করা যাবে—এসব তথ্য দিয়ে সেবাদাতা হিসেবে যুক্ত হোন।</p><div class="steps"><div class="step"><b>১. নিবন্ধন করুন</b><span>নিজের অ্যাকাউন্ট তৈরি</span></div><div class="step"><b>২. প্রোফাইল পূরণ</b><span>কাজ, অভিজ্ঞতা ও এলাকা জানান</span></div><div class="step"><b>৩. যাচাইয়ের অপেক্ষা</b><span>অনুমোদনের পর তালিকায় দেখান</span></div></div><div class="actions"><a class="btn" href="#signup-provider">সেবাদাতা অ্যাকাউন্ট খুলুন →</a><a class="btn light" href="#login">আগে থেকেই অ্যাকাউন্ট আছে</a></div></div></div></section>`,
signup:role=>`
<section class="page"><div class="wrap"><div class="crumb"><a href="#home">হোম</a>　/　নিবন্ধন</div><div class="panel"><div class="eyebrow">নতুন অ্যাকাউন্ট</div><h1>${role==='provider'?'সেবাদাতা হিসেবে নিবন্ধন':'সেবাগ্রহীতা হিসেবে নিবন্ধন'}</h1><p>প্রয়োজনীয় তথ্য দিয়ে অ্যাকাউন্ট তৈরি করুন।</p><form class="form" onsubmit="demoSubmit(event,'signup')"><div class="fields"><div class="field"><label>আপনার নাম</label><input required placeholder="পূর্ণ নাম"></div><div class="field"><label>ইমেইল</label><input type="email" required placeholder="name@example.com"></div></div><div class="field"><label>অ্যাকাউন্টের ধরন</label><select id="role"><option value="customer" ${role==='customer'?'selected':''}>আমি কাজের লোক খুঁজছি</option><option value="provider" ${role==='provider'?'selected':''}>আমি নিজে কাজ করি</option></select></div><div class="alert">এটি অনলাইন প্রিভিউ। আসল অ্যাকাউন্ট তৈরি ও পাসওয়ার্ড নিরাপদে সংরক্ষণের জন্য এখনো Supabase সংযোগ করা হয়নি। এখানে আসল পাসওয়ার্ড দেবেন না।</div><button class="btn" type="submit">পরবর্তী ধাপ</button></form><a class="back" href="#login">আগে থেকেই অ্যাকাউন্ট আছে? লগইন</a></div></div></section>`,
login:()=>`
<section class="page"><div class="wrap"><div class="crumb"><a href="#home">হোম</a>　/　লগইন</div><div class="panel"><div class="eyebrow">স্বাগতম</div><h1>আপনার অ্যাকাউন্টে প্রবেশ করুন</h1><p>ইমেইল দিয়ে লগইন করুন।</p><form class="form" onsubmit="demoSubmit(event,'login')"><div class="field"><label>ইমেইল</label><input type="email" required placeholder="name@example.com"></div><div class="alert">ডেমো সংস্করণ: আসল লগইন এখনো চালু হয়নি। পাসওয়ার্ড লিখবেন না।</div><button class="btn" type="submit">লগইন</button></form><a class="back" href="#signup-customer">নতুন অ্যাকাউন্ট খুলুন</a></div></div></section>`,
profile:()=>`

about:()=>`
<section class="page"><div class="wrap"><div class="crumb"><a href="#home">হোম</a>　/　কীভাবে কাজ করে</div><div class="panel"><div class="eyebrow">সেবা খুঁজুন</div><h1>সহজে স্থানীয় সেবাদাতার সঙ্গে যুক্ত হোন</h1><p>এই প্ল্যাটফর্মের উদ্দেশ্য হলো সেবা প্রয়োজন এমন মানুষ এবং স্থানীয় সেবাদাতাদের এক জায়গায় আনা।</p><div class="steps"><div class="step"><b>অ্যাকাউন্ট খুলুন</b><span>সেবাগ্রহীতা বা সেবাদাতা বেছে নিন।</span></div><div class="step"><b>এলাকা ও তথ্য দিন</b><span>শুধু প্রয়োজনীয় তথ্য দিন; পূর্ণ বাসার ঠিকানা নয়।</span></div><div class="step"><b>যোগাযোগ করুন</b><span>পরিচয় ও কাজের খরচ আগে যাচাই করুন।</span></div></div><div class="alert">কাউকে জাতীয় পরিচয়পত্র, জন্মনিবন্ধন, ব্যাংক PIN বা পাসওয়ার্ড দেবেন না। অপরিচিত কারও কাছে অগ্রিম টাকা পাঠানোর আগে সতর্ক থাকুন।</div></div></div></section>`
};
function render(){let route=location.hash.replace('#','')||'home';let html;if(route==='signup-customer')html=renderers.signup('customer');else if(route==='signup-provider')html=renderers.signup('provider');else html=(renderers[route]||renderers.home)();app.innerHTML=html;window.scrollTo(0,0)}
function demoSubmit(e,kind){e.preventDefault();const msg=kind==='signup'?'নিবন্ধন পেজের প্রিভিউ দেখা যাচ্ছে। আসল অ্যাকাউন্ট তৈরির ব্যবস্থা এখনো সংযুক্ত হয়নি।':kind==='login'?'আসল লগইন এখনো চালু হয়নি।':'এটি প্রিভিউ—তথ্য ডেটাবেসে সংরক্ষিত হয়নি।';const d=document.createElement('div');d.className='alert';d.textContent=msg;e.target.appendChild(d)}

function filterSamples(category,button){
 document.querySelectorAll('.service-category').forEach(el=>el.classList.remove('active'));
 if(button)button.classList.add('active');
 let visible=0;
 document.querySelectorAll('.service-sample').forEach(card=>{
  const show=category==='সব'||card.dataset.category===category;
  card.style.display=show?'block':'none';
  if(show)visible++;
 });
 const count=document.getElementById('result-count');
 if(count)count.textContent=visible+'টি নমুনা প্রোফাইল';
}
function showDemoMessage(message){
 const box=document.getElementById('demo-message');
 if(box){box.textContent=message;box.classList.add('show');box.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function searchDemo(event){
 event.preventDefault();
 const district=document.getElementById('find-district')?.value||'';
 const area=document.getElementById('find-area')?.value||'';
 const keyword=(document.getElementById('find-keyword')?.value||'').trim();
 const note='আপনার নির্বাচিত এলাকা: '+(district||'নির্বাচন করা হয়নি')+'، '+(area||'নির্বাচন করা হয়নি')+(keyword?'। প্রয়োজন: '+keyword:'')+'। এখনো লাইভ সেবাদাতার ডেটাবেস সংযুক্ত হয়নি—তাই এই সার্চটি প্রিভিউ হিসেবে দেখানো হচ্ছে।';
 showDemoMessage(note);
}

window.addEventListener('hashchange',render);render();
</script>
</body></html>
